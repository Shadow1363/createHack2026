<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gênesis — leitura contínua</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="marker" id="marker">
      Gênesis · <span id="markerRef">—</span>
    </div>
    <div class="hint" id="scrollHint">Role <span class="arrow">↓</span></div>

    <button class="focus-btn" id="focusBtn" type="button" aria-pressed="false">
      <span class="focus-icon"></span>
      <span id="focusLabel">Modo foco</span>
    </button>

    <button
      class="jump-btn"
      id="jumpBtn"
      type="button"
      aria-haspopup="dialog"
      aria-controls="jumpPanel"
    >
      Ir para capítulo
    </button>
    <div
      class="jump-panel"
      id="jumpPanel"
      role="dialog"
      aria-modal="true"
      aria-label="Ir para capítulo de Gênesis"
    >
      <p class="jump-title">Gênesis</p>
      <div class="jump-grid" id="jumpGrid"></div>
      <div class="jump-foot">
        <span id="jumpFromStorage" hidden
          >Última parada: capítulo
          <button class="chip" id="jumpResumeBtn" type="button">—</button></span
        >
        <button class="jump-close" id="jumpClose" type="button">Fechar</button>
      </div>
    </div>
    <div class="jump-backdrop" id="jumpBackdrop" hidden></div>

    <div class="login-shell" id="loginShell">
      <div class="login-card" id="loginCard" hidden>
        <div class="login-brand">
          <img class="login-ico-big" src="logo.png" alt="Zmode" />
          <p class="login-sub">Para Gen Z, Feito pelo Gen Z</p>
          <p class="login-invite-note" id="loginInviteNote" hidden>
            Você foi convidado(a) para uma leitura juntos. Entre ou continue sem conta para aceitar.
          </p>
        </div>

        <!-- <div class="login-perms" id="loginPerms">
          <p class="login-p-title">O que vamos acessar:</p>
          <ul class="login-pill">
            <span class="login-dot"></span
            >Seus destaques (highlights) para exibir os versículos salvos em sua
            conta YouVersion
          </ul>
        </div> -->

        <button class="login-btn" id="loginBtn" type="button">
          <span class="login-ico"
            ><image class="login-ico" src="youversion.png" alt="YouVersion"
          /></span>
          Entrar com YouVersion
        </button>

        <p class="login-foot">
          <!-- <span id="loginAlt"
            >Você será redirecionado para a página oficial de aprovação
            YouVersion. Cancelamento é permitido a qualquer momento.</span
          > -->
          <button class="login-skip" id="loginSkipBtn" type="button">
            Continuar sem conta
          </button>
        </p>
      </div>

      <div class="login-card login-loading" id="loadingCard" hidden>
        <div class="login-spinner"></div>
        <p class="login-loading-title" id="loadingTitle">
          Conectando com YouVersion…
        </p>
        <p class="login-loading-sub" id="loadingSub">Por favor, aguarde.</p>
      </div>

      <div class="login-card login-error" id="errorCard" hidden>
        <p class="login-err-title" id="errTitle">Não foi possível entrar</p>
        <p class="login-err-body" id="errBody"></p>
        <details class="login-debug" id="loginDebug" hidden>
          <summary>Debug / Informações técnicas</summary>
          <pre class="login-debug-box" id="loginDebugBox"></pre>
        </details>
        <div class="login-err-actions" id="errExtraActions"></div>
        <div class="login-err-actions">
          <button class="login-btn" id="errRetry" type="button">
            Tentar novamente
          </button>
          <button class="login-skip" id="errSkip" type="button">
            Continuar sem conta
          </button>
        </div>
      </div>
    </div>

    <button class="logout-btn" id="logoutBtn" type="button" hidden>Sair</button>

    <div class="scroller" id="scroller"></div>

    <div class="app-view" id="togetherView" hidden></div>
    <div class="app-view" id="youView" hidden></div>

    <nav class="tabbar" id="tabbar" hidden>
      <button class="tabbar-btn is-active" id="tabRead" type="button" data-tab="read" onclick="window.Together&&Together.switchTab('read')">
        <svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5c2-1 5-1 8 0v13c-3-1-6-1-8 0v-13Z"/><path d="M20 5.5c-2-1-5-1-8 0v13c3-1 6-1 8 0v-13Z"/></svg>
        <span>Read</span>
      </button>
      <button class="tabbar-btn" id="tabTogether" type="button" data-tab="together" onclick="window.Together&&Together.switchTab('together')">
        <svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.3c2.3.3 4.5 2.2 4.5 5.7"/></svg>
        <span>Together</span>
      </button>
      <button class="tabbar-btn" id="tabYou" type="button" data-tab="you" onclick="window.Together&&Together.switchTab('you')">
        <svg class="tabbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        <span>You</span>
      </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-client.js?v=9"></script>
    <script src="together.js?v=9"></script>
    <script src="script.js?v=9"></script>
    <script>
      (function wireTabbar() {
        var bar = document.getElementById("tabbar");
        if (!bar || bar.dataset.wired === "1") return;
        bar.dataset.wired = "1";
        bar.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-tab]");
          if (!btn || !bar.contains(btn)) return;
          if (window.Together && typeof window.Together.switchTab === "function") {
            window.Together.switchTab(btn.getAttribute("data-tab"));
          }
        });
        if (window.Together && typeof window.Together.init === "function") {
          window.Together.init();
        }
      })();
    </script>
  </body>
</html>
